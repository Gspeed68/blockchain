name: custody-log

# Brings up: 4 Besu QBFT validators (all on one host — see
# scripts/02-provision-vm.sh for why), Web3Signer in front of validator-1
# (the app's write path), Prometheus/Grafana watching all four nodes, and
# the app itself (api + frontend).
#
# Prerequisites (scripts/05-bring-up-stack.sh does all of this for you):
#   - QBFT-Network/generated/genesis.json                          (script 03)
#   - docker/besu/validators/validator-{1..4}/{key,key.pub}         (script 03's output, mapped by script 05)
#   - docker/besu/validators/validator-{1..4}/bootnodes.txt         (script 05, computed from key.pub files)
#   - docker/web3signer/keys/eth1-app-identity.yaml                 (script 04)
#
# api/frontend are started SEPARATELY by scripts/06-deploy-contract-and-app.sh,
# after the contract has actually been deployed — see that script for why
# (api/src/config/contract.json needs a real address before the api
# container is worth starting, and it's bind-mounted, not baked into the
# image, so a restart — not a rebuild — is enough once it's written).
x-besu-common: &besu-common
  image: hyperledger/besu:24.7.0
  restart: unless-stopped
  networks: [custody-log-net]
  entrypoint: ["/bin/sh", "-c"]

services:
  besu-validator-1:
    <<: *besu-common
    volumes:
      - ../QBFT-Network/generated/genesis.json:/data/genesis.json:ro
      - ./besu/validators/validator-1:/data/node:ro
      - besu-data-1:/data/db
    ports:
      - "8545:8545" # JSON-RPC (also IP-scoped at the NSG level on Azure)
      - "8546:8546" # WebSocket
      - "30303:30303/tcp"
      - "30303:30303/udp"
    command:
      - >
        exec besu
        --genesis-file=/data/genesis.json
        --node-private-key-file=/data/node/key
        --data-path=/data/db
        --bootnodes=$$(cat /data/node/bootnodes.txt)
        --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
        --rpc-http-api=ETH,NET,QBFT,WEB3
        --rpc-http-cors-origins="*"
        --rpc-ws-enabled --rpc-ws-host=0.0.0.0 --rpc-ws-port=8546
        --host-allowlist="*"
        --p2p-host=0.0.0.0 --p2p-port=30303
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9545

  besu-validator-2:
    <<: *besu-common
    volumes:
      - ../QBFT-Network/generated/genesis.json:/data/genesis.json:ro
      - ./besu/validators/validator-2:/data/node:ro
      - besu-data-2:/data/db
    command:
      - >
        exec besu
        --genesis-file=/data/genesis.json
        --node-private-key-file=/data/node/key
        --data-path=/data/db
        --bootnodes=$$(cat /data/node/bootnodes.txt)
        --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
        --rpc-http-api=ETH,NET,QBFT,WEB3
        --host-allowlist="*"
        --p2p-host=0.0.0.0 --p2p-port=30303
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9545

  besu-validator-3:
    <<: *besu-common
    volumes:
      - ../QBFT-Network/generated/genesis.json:/data/genesis.json:ro
      - ./besu/validators/validator-3:/data/node:ro
      - besu-data-3:/data/db
    command:
      - >
        exec besu
        --genesis-file=/data/genesis.json
        --node-private-key-file=/data/node/key
        --data-path=/data/db
        --bootnodes=$$(cat /data/node/bootnodes.txt)
        --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
        --rpc-http-api=ETH,NET,QBFT,WEB3
        --host-allowlist="*"
        --p2p-host=0.0.0.0 --p2p-port=30303
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9545

  besu-validator-4:
    <<: *besu-common
    volumes:
      - ../QBFT-Network/generated/genesis.json:/data/genesis.json:ro
      - ./besu/validators/validator-4:/data/node:ro
      - besu-data-4:/data/db
    command:
      - >
        exec besu
        --genesis-file=/data/genesis.json
        --node-private-key-file=/data/node/key
        --data-path=/data/db
        --bootnodes=$$(cat /data/node/bootnodes.txt)
        --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
        --rpc-http-api=ETH,NET,QBFT,WEB3
        --host-allowlist="*"
        --p2p-host=0.0.0.0 --p2p-port=30303
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9545

  # Sits in front of besu-validator-1 for writes. The app's backend (api/)
  # talks to THIS service's RPC endpoint, not Besu's directly — Web3Signer
  # answers eth_accounts/eth_sendTransaction/eth_signTransaction itself
  # (signing with the Azure Key Vault key over the VM's system-assigned
  # managed identity, per docker/web3signer/keys/eth1-app-identity.yaml)
  # and forwards every other JSON-RPC method straight through to Besu.
  web3signer:
    image: consensys/web3signer:24.8.0
    restart: unless-stopped
    networks: [custody-log-net]
    depends_on: [besu-validator-1]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./web3signer/keys:/keys:ro
    command:
      - --key-store-path=/keys
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9001
      - eth1
      - --downstream-http-host=besu-validator-1
      - --downstream-http-port=8545
      - --http-listen-host=0.0.0.0
      - --http-listen-port=9000

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    networks: [custody-log-net]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    networks: [custody-log-net]
    depends_on: [prometheus]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme-locally}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  # The backend API. Talks to besu-validator-1 (reads) and web3signer
  # (writes) over the compose network, so it uses the in-network hostnames,
  # not the host's exposed ports. contract.json is bind-mounted read-only
  # from the host rather than baked into the image (see the file-level
  # comment above) so a fresh contract deploy takes effect on the next
  # `docker compose restart api`, not a rebuild.
  api:
    build:
      context: ../api
    restart: unless-stopped
    networks: [custody-log-net]
    depends_on: [besu-validator-1, web3signer]
    environment:
      - PORT=4100
      - LOG_LEVEL=info
      - BESU_RPC_URL=http://besu-validator-1:8545
      - WEB3SIGNER_RPC_URL=http://web3signer:9000
      - CHAIN_ID=190417
      - CONTRACT_CONFIG_PATH=/app/src/config/contract.json
      - UPLOADS_DIR=/app/uploads
      - PUBLIC_BASE_URL=${API_PUBLIC_BASE_URL:-http://localhost:4100}
    volumes:
      - ../api/src/config/contract.json:/app/src/config/contract.json:ro
      - api-uploads:/app/uploads
    ports:
      - "4100:4100"

  # Static build served by nginx. VITE_API_BASE_URL is a build-time arg
  # (baked into the JS bundle, same as any Vite app) — see scripts/
  # 06-deploy-contract-and-app.sh for how it's set to the VM's actual
  # public IP before this image is built.
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:4100}
    restart: unless-stopped
    networks: [custody-log-net]
    depends_on: [api]
    ports:
      - "5174:80"

networks:
  custody-log-net:
    driver: bridge

volumes:
  besu-data-1:
  besu-data-2:
  besu-data-3:
  besu-data-4:
  prometheus-data:
  grafana-data:
  api-uploads:
