server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path react-router owns (e.g. /items/3) falls
    # through to index.html so the client-side router handles it instead
    # of nginx 404ing on a path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
